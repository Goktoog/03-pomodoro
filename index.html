<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
</head>

<body>
    <header>
        <button id="themeButton" class="theme-switch" type="button" aria-label="Tema değiştir">
            <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true">☀</span>
            <span class="theme-switch__thumb" aria-hidden="true"></span>
            <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true">☾</span>
        </button>
    </header>
    <h1>Pomodoro Timer</h1>
    <h1 id="timer" class="timer">25:00</h1>
    <div>
        <p id="totalFocusTime">Toplam odaklanma süresi: 0 dk</p>
        <div>
            <p id="todayDate">Bugün: 01/01/0000</p>
        </div>
    </div>

    <button id="startButton">Başlat</button>

    <table>
        <ul>
            <button id="focusButton">Odaklanma oturumu
                <br>
                <p id="focusTime">25 dk</p>
            </button>
        </ul>

        <ul>
            <button id="shortBreakButton">Kısa mola
                <br>
                <p id="shortBreakTime">5 dk</p>
            </button>
        </ul>

        <ul>
            <button id="longBreakButton">Uzun mola
                <br>
                <p id="longBreakTime">25 dk</p>
            </button>
        </ul>

    </table>

    <!-- streak alanı yapılacka ve streak yazılacak-->
    <div>
        <p id="streak">Streak: 0</p>
    </div>
    <!-- Bugün yapılan seanslar -->
    <div>
        <p id="todaySessions">Bugün yapılan seanslar: 0</p>
    </div>


    <footer>
        <p>© 2024 Pomodoro Timer. Tüm hakları saklıdır.</p>
</body>

</html>
