<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
</head>

<body>
    <h1>Pomodoro Timer</h1>
    <div>
        <button id="startButton">Başlat</button>
    </div>

    <table>
        <tr>
            <td>Çalışma Süresi (dakika):</td>
            <td><input type="number" id="workDuration" value="25"></td>
        </tr>
        <tr>
            <td>Mola Süresi (dakika):</td>
            <td><input type="number" id="breakDuration" value="5"></td>
        </tr>
        <tr>
            <td>Uzun Mola:</td>
            <td><input type="number" id="totalPomodoros" value="30"></td>
        </tr>
    </table>
</body>

</html>
